name: 'ci-why'
description: 'Analyze a CI build log and explain the failure in plain English'
author: 'ciwhy-tool'

inputs:
  log-file:
    description: 'Path to the build log file to analyze'
    required: true
  anthropic-api-key:
    description: 'Anthropic API key. Get one free at console.anthropic.com'
    required: true
  github-token:
    description: 'GitHub token used to post the PR comment'
    required: false
    default: ${{ github.token }}
  pr-number:
    description: 'Pull request number to post the analysis on. Leave empty to skip commenting.'
    required: false
    default: ''

outputs:
  analysis:
    description: 'The full ci-why analysis text'
    value: ${{ steps.analyze.outputs.analysis }}

runs:
  using: 'composite'
  steps:
    - name: Run ci-why
      id: analyze
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        LOG_FILE: ${{ inputs.log-file }}
      run: |
        # Run ci-why and strip ANSI colour codes so output is clean in PR comments
        raw=$(npx --yes ci-why@latest "$LOG_FILE" 2>/dev/null)
        clean=$(printf '%s' "$raw" | sed 's/\x1B\[[0-9;]*[mGKHF]//g')

        echo "analysis<<EOF" >> "$GITHUB_OUTPUT"
        printf '%s\n' "$clean" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

        printf '%s\n' "$clean"

    - name: Post PR comment
      if: ${{ inputs.pr-number != '' }}
      uses: actions/github-script@v7
      env:
        CI_WHY_ANALYSIS: ${{ steps.analyze.outputs.analysis }}
        CI_WHY_PR_NUMBER: ${{ inputs.pr-number }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          await github.rest.issues.createComment({
            issue_number: parseInt(process.env.CI_WHY_PR_NUMBER, 10),
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: [
              '### ci-why: build failure analysis',
              '',
              '```',
              process.env.CI_WHY_ANALYSIS,
              '```',
            ].join('\n'),
          });
